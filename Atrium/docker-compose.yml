services:
  atrium-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: atrium
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - atrium-postgres:/var/lib/postgresql/data

  atrium-web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - atrium-db
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_URL: http://localhost:3000
      DATABASE_URL: postgres://postgres:postgres@atrium-db:5432/atrium
      AUTH_SECRET: change-me-in-production
      ATRIUM_USERNAME: atrium
      ATRIUM_PASSWORD: atrium
    ports:
      - "3000:3000"

volumes:
  atrium-postgres:
